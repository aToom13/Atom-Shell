name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y jq rsync shellcheck lua5.4
      - name: Run smoke tests
        run: ./tests/smoke.sh
