name: Create release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create packages
        run: |
          mkdir -p release
          rsync -av \
            --exclude='release' \
            --exclude='.*' \
            --exclude='nix' \
            --exclude='flake.lock' \
            --exclude='flake.nix' \
            . release
          echo "$GITHUB_SHA" > release/REVISION
          tar -czf atom-shell-${{ github.ref_name }}.tar.gz release
          cp atom-shell-${{ github.ref_name }}.tar.gz atom-shell-latest.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            atom-shell-${{ github.ref_name }}.tar.gz
            atom-shell-latest.tar.gz
          generate_release_notes: true
